name: Noticias de streamers colombianos

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recopilar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopilar noticias recientes
        run: python scripts/noticias.py

      - name: Guardar informe en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar borrador de noticias"
          file_pattern: "borradores/*.md"