
name: Radar de creadores y TikTok

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: radar-creadores-tiktok
  cancel-in-progress: false

jobs:
  generar-radares:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests yt-dlp

      - name: Ejecutar radar principal de creadores
        run: python scripts/noticias.py

      - name: Ejecutar radar de TikTok
        run: python scripts/tiktok.py

      - name: Guardar informes actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add borradores/radar_creadores.md
          git add borradores/clips_tiktok.md

          if git diff --cached --quiet; then
            echo "Los informes no presentan cambios."
          else
            git commit -m "Actualizar radares de creadores y TikTok"
            git push
          fi
