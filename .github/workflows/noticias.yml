
name: Radar de creadores y TikTok

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generar-radares:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Ejecutar radar principal
        run: python scripts/noticias.py

      - name: Ejecutar radar de TikTok
        run: python scripts/tiktok.py

      - name: Guardar informes actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add borradores/radar_creadores.md borradores/clips_tiktok.md
          git diff --cached --quiet || git commit -m "Actualizar radares de creadores y TikTok"
          git push
