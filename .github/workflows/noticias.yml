name: Radar de creadores colombianos

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-creadores-colombianos
  cancel-in-progress: false

jobs:
  recopilar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar herramienta de búsqueda de YouTube
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp

      - name: Ejecutar radar de creadores
        run: python scripts/noticias.py

      - name: Guardar informe en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar radar de creadores"
          file_pattern: "borradores/*.md"