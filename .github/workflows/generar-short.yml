name: Generar Short narrado de Clips Colombia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install requests pillow edge-tts

      - name: Comprobar sintaxis del generador y publicador
        run: python -m py_compile scripts/generar_short.py scripts/subir_short_generado.py scripts/publicar.py

      - name: Generar video narrado vertical
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/generar_short.py

      - name: Guardar video y fuentes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: clips-colombia-short
          path: |
            salida/clips_colombia_short.mp4
            salida/fuentes.txt
          if-no-files-found: error
          retention-days: 7

      - name: Subir a YouTube en privado
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/subir_short_generado.py
